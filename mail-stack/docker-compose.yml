services:
  postfix:
    build:
      context: ./postfix
    container_name: postfix
    hostname: mail.${MAIL_DOMAIN}
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      POSTGRES_HOST: ${POSTGRES_HOST:-plane-db}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
    volumes:
      - ./postfix/main.cf.tmpl:/etc/postfix/main.cf.tmpl:ro
      - ./postfix/master.cf.tmpl:/etc/postfix/master.cf.tmpl:ro
      - ./postfix/pgsql-virtual-mailbox-domains.cf.tmpl:/etc/postfix/pgsql-virtual-mailbox-domains.cf.tmpl:ro
      - ./postfix/pgsql-virtual-mailbox-maps.cf.tmpl:/etc/postfix/pgsql-virtual-mailbox-maps.cf.tmpl:ro
      - ./postfix/pgsql-virtual-alias-maps.cf.tmpl:/etc/postfix/pgsql-virtual-alias-maps.cf.tmpl:ro
      - ./data/postfix:/var/lib/postfix
      # certbot on the host owns the mail.<domain> certificate; the whole tree
      # is mounted because live/ holds symlinks into archive/. The legacy
      # Caddy-issued cert stays mounted so an in-place upgrade keeps TLS up
      # until certbot has issued its own — both mounts are probed by
      # postfix/entrypoint.sh, certbot first.
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - caddy-data:/etc/letsencrypt-caddy:ro
      - dovecot-auth:/var/spool/postfix/private
    depends_on:
      - dovecot
      - rspamd
    networks:
      - mail-internal
      - plane_default

  dovecot:
    build:
      context: ./dovecot
    container_name: dovecot
    hostname: dovecot
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      POSTGRES_HOST: ${POSTGRES_HOST:-plane-db}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_MASTER_USER: ${MAIL_MASTER_USER:-master}
      MAIL_MASTER_PASSWORD: ${MAIL_MASTER_PASSWORD:-}
    ports:
      - "143:143"
      - "993:993"
    volumes:
      - ./dovecot/dovecot.conf.tmpl:/etc/dovecot/dovecot.conf.tmpl:ro
      - ./dovecot/dovecot-sql.conf.ext.tmpl:/etc/dovecot/dovecot-sql.conf.ext.tmpl:ro
      - ./data/mail:/var/mail/vhosts
      # See the postfix service above for why both cert locations are mounted.
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - caddy-data:/etc/letsencrypt-caddy:ro
      - dovecot-auth:/var/spool/postfix/private
    networks:
      - mail-internal
      - plane_default

  rspamd:
    image: rspamd/rspamd:latest
    container_name: rspamd
    hostname: rspamd
    restart: unless-stopped
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - ./data/rspamd:/var/lib/rspamd
    depends_on:
      - mail-redis
    networks:
      - mail-internal

  mail-redis:
    image: valkey/valkey:7.2.11-alpine
    container_name: mail-redis
    hostname: redis
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    networks:
      - mail-internal

  # NOTE: the former `cert-reloader` service is gone. It watched the Caddy data
  # volume with inotify, which no longer receives the mail certificate — and
  # watching certbot's live/ directory does not work anyway, because renewal
  # swaps symlinks rather than rewriting files. Postfix and Dovecot are now
  # reloaded by the certbot deploy hook that deployments/nginx/setup-nginx.sh
  # installs at /etc/letsencrypt/renewal-hooks/deploy/reload-plane.sh.

networks:
  mail-internal:
    driver: bridge
  plane_default:
    external: true
    name: plane_default

volumes:
  dovecot-auth:
  caddy-data:
    external: true
    name: plane_caddy-data
